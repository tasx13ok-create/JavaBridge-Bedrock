name: Build Windows Bedrock client plugin

on:
  push:
    paths:
      - "native/levilamina-client/**"
      - ".github/workflows/native-client.yml"
  pull_request:
    paths:
      - "native/levilamina-client/**"
      - ".github/workflows/native-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-client:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
      - uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22
      - name: Show toolchain
        shell: pwsh
        run: |
          xmake --version
          clang-cl --version
      - name: Update XMake repositories
        working-directory: native/levilamina-client
        run: xmake repo -u
      - name: Configure LeviLamina client build
        working-directory: native/levilamina-client
        run: xmake f -p windows -a x64 -m release --target_type=client -y
      - name: Compile native plugin
        working-directory: native/levilamina-client
        run: xmake -w -y
      - name: Upload compiled plugin if build succeeds
        uses: actions/upload-artifact@v4
        with:
          name: JavaBridge-Windows-Bedrock-client-experimental
          path: native/levilamina-client/bin/
          if-no-files-found: error
