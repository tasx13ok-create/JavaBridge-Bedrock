name: Verify JavaBridge core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Java runtime and demo JAR
        run: python tools/build.py
      - name: Check all local JVM and native relay tests
        run: python -m unittest discover -s tests -v
      - name: Inspect authored demo JAR
        run: python tools/inspect.py out/mods
